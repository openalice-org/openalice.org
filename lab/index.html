<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Lab diary · OpenAlice</title>
  <link rel="icon" href="../alice.png">
  <style>
    :root { color-scheme: light; --ink: #22241f; --muted: #6a6d65; --line: #dedfd9; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: #fafbf9; font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    a { color: inherit; text-underline-offset: .2em; }
    a:hover { color: #42648b; }
    a:focus-visible, button:focus-visible, video:focus-visible { outline: 3px solid #42648b; outline-offset: 5px; }
    header, main, footer { max-width: 1680px; margin: auto; padding-inline: clamp(20px, 4vw, 64px); }
    header { padding-top: 36px; padding-bottom: 42px; border-bottom: 1px solid var(--line); }
    .brand { display: inline-flex; gap: 12px; align-items: center; text-decoration: none; font-size: 16px; }
    .brand img { width: 36px; height: 36px; }
    h1, h2, h3 { font-family: "Iowan Old Style", Palatino, Georgia, serif; font-weight: 500; line-height: 1.15; }
    h1 { font-size: clamp(40px, 5vw, 64px); margin: 24px 0 12px; }
    header p { color: var(--muted); margin: 0; }
    article { padding-block: 44px 64px; }
    time { color: var(--muted); font-size: 15px; }
    h2 { font-size: clamp(30px, 4vw, 44px); margin: 8px 0 26px; }
    .entry-heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; }
    .entry-heading a { font-size: 14px; margin-bottom: 30px; color: var(--muted); }
    .entry-media { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
    .media-card { min-width: 0; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: white; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 14px; min-height: 62px; }
    .toolbar h3 { margin: 0; font: inherit; font-weight: 500; }
    button, .expand-link { color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 7px 12px; font: inherit; cursor: pointer; text-decoration: none; white-space: nowrap; }
    button:hover, .expand-link:hover { background: #f0f1ed; }
    .media-stage { position: relative; width: 100%; aspect-ratio: 1280 / 900; overflow: hidden; background: #f1f2ee; }
    iframe { display: block; border: 0; position: absolute; width: 1280px; height: 900px; top: 50%; left: 50%; transform-origin: top left; transform: scale(var(--preview-scale, .4)) translate(-50%, -50%); background: #fff; }
    video { width: 100%; height: 100%; display: block; object-fit: contain; }
    .media-card:fullscreen { width: 100%; height: 100%; border: 0; border-radius: 0; display: flex; flex-direction: column; }
    .media-card:fullscreen .media-stage { flex: 1; min-height: 0; aspect-ratio: auto; }
    .media-card:fullscreen iframe { position: static; width: 100%; height: 100%; transform: none; }
    .caption { color: var(--muted); font-size: 14px; margin: 14px 2px 0; }
    footer { border-top: 1px solid var(--line); padding-block: 24px; font-size: 14px; color: var(--muted); }
    @media(max-width: 700px) { header { padding-top: 20px; padding-bottom: 28px; } article { padding-top: 28px; } .entry-heading { display: block; } .entry-heading a { display: none; } .entry-media { grid-template-columns: 1fr; gap: 20px; } }
  </style>
</head>
<body>
<header>
  <a class="brand" href="../"><img src="../alice.png" alt="" width="36" height="36">OpenAlice</a>
  <h1>Lab diary</h1>
  <p>Sketches, experiments and working notes.</p>
</header>
<main>
  <article id="researcher-view-2026-11-22">
    <div class="entry-heading">
      <div><time datetime="2026-11-22">22 November 2026</time><h2>Researcher view</h2></div>
      <a href="#researcher-view-2026-11-22" aria-label="Link to the researcher view entry">Link to this entry</a>
    </div>
    <div class="entry-media">
      <section class="media-card" id="prototype-card" aria-labelledby="prototype-title">
        <div class="toolbar"><h3 id="prototype-title">Interactive prototype</h3><a class="expand-link" data-expand="prototype-card" href="assets/researcher-view-2026-11-22/index.html?personView=study&amp;person=A5035932611" target="_blank" rel="noopener" aria-label="Expand prototype">Expand</a></div>
        <div class="media-stage" id="prototype-stage">
          <iframe id="prototype" src="assets/researcher-view-2026-11-22/index.html?personView=study&amp;person=A5035932611" title="Researcher view prototype: Current, Simplified and Embedding-based" allowfullscreen></iframe>
        </div>
      </section>
      <section class="media-card" id="video-card" aria-labelledby="video-title">
        <div class="toolbar"><h3 id="video-title">Recorded walkthrough · 3:48</h3><a class="expand-link" data-expand="video-card" href="assets/researcher-view-walkthrough-2026-11-22.mp4" target="_blank" rel="noopener" aria-label="Expand walkthrough">Expand</a></div>
        <div class="media-stage">
          <video controls playsinline preload="metadata" poster="assets/researcher-view-poster.jpg" aria-label="Researcher view walkthrough">
            <source src="assets/researcher-view-walkthrough-2026-11-22.mp4" type="video/mp4">
            <a href="assets/researcher-view-walkthrough-2026-11-22.mp4">Download the walkthrough</a>
          </video>
        </div>
      </section>
    </div>
    <p class="caption">Embedding positions in this sketch are simulated from paper titles.</p>
  </article>
</main>
<footer>OpenAlice · Lab diary</footer>
<script>
  // Keep the frozen desktop layout legible as a miniature, without changing its assets.
  const stage = document.getElementById('prototype-stage');
  new ResizeObserver(([entry]) => {
    stage.style.setProperty('--preview-scale', entry.contentRect.width / 1280);
  }).observe(stage);

  for (const link of document.querySelectorAll('[data-expand]')) {
    const card = document.getElementById(link.dataset.expand);
    if (!card.requestFullscreen || !document.fullscreenEnabled) continue;
    const label = link.getAttribute('aria-label');
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = 'Expand';
    button.setAttribute('aria-label', label);
    link.replaceWith(button);
    button.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement === card) await document.exitFullscreen();
        else await card.requestFullscreen();
      } catch {
        button.replaceWith(link);
        link.focus();
      }
    });
    document.addEventListener('fullscreenchange', () => {
      const expanded = document.fullscreenElement === card;
      button.textContent = expanded ? 'Close' : 'Expand';
      button.setAttribute('aria-label', expanded ? 'Close expanded view' : label);
      if (expanded) button.focus();
    });
  }
</script>
</body>
</html>
