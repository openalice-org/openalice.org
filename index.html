<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenAlice</title>
<meta name="description" content="OpenAlice: charting the invisible college. In the making.">
<style>
  :root { --ink: #1d1b18; --muted: #6b6b6b; --line: #d9d8d2; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: #fff; }
  iframe { display: block; flex: 1 1 auto; width: 100%; min-height: 0; border: 0; }
  footer {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 16px;
    padding: 12px 44px;
    border-top: 1px solid var(--line);
    font: 15px/1.4 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    color: var(--ink);
  }
  footer .mark { display: block; line-height: 0; }
  footer .mark img { display: block; width: 40px; height: 40px; }
  footer .divider { width: 1px; height: 28px; background: var(--ink); }
  /* padding-top optically centres the serif text on the divider and mark:
     the caps' ink sits ~1.5px above the line box's centre. */
  footer .links { display: flex; align-items: center; gap: 8px; padding-top: 3px; }
  footer .tagline-foot { font-style: italic; }
  footer a.tagline-foot { text-decoration: none; }
  footer a.tagline-foot:hover { text-decoration: underline; text-decoration-color: var(--muted); }
  footer .sep { color: var(--muted); }
  footer a { color: inherit; text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 3px; }
  footer a:hover { text-decoration-color: var(--ink); }
</style>

     loaded only on the production host so local previews are never counted. -->

    _paq.push(['trackPageView']);
    _paq.push(['enableLinkTracking']);

      _paq.push(['setTrackerUrl', u + 'matomo.php']);

</script>
